[project]
name = "kml-parser"
version = "0.0.1"
description = "Parse Google Earth KML hole files into the unified hole JSON schema"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.scripts]
kml-parser = "kml_parser.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kml_parser"]
