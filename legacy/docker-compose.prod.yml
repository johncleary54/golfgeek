version: "3"
services:
  client:
    container_name: golfgeek-client
    working_dir: /app
    build:
      context: ./client
    restart: unless-stopped

  pocketbase:
    container_name: golfgeek-pocketbase
    working_dir: /pb
    build:
      context: ./pocketbase
    volumes:
      - ./pocketbase/pb_data:/pb/pb_data
      - ./pocketbase/pb_migrations:/pb/pb_migrations
    restart: unless-stopped

  nginx:
    container_name: golfgeek-nginx
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - 80:80
      - 443:443
    restart: unless-stopped
